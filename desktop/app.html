  if(!r.items.length){openModal('清理离线终端',`<p>${esc(r.message||'没有可清理的离线终端记录。')}</p>`,'<button data-close>关闭</button>','session-removal-empty');return;}
  if(typeof r.ticket!=='string'||!r.ticket)throw Error('清理确认票据无效。');
  const frozen=JSON.parse(JSON.stringify(r)),effect=r.stop_active?'将停止 Bridge 接入并移除以下终端记录；不关闭 Xshell 或 SSH。':'将移除以下离线终端记录，保留任务历史；不关闭 Xshell 或 SSH。';
  openModal(r.stop_active?'停止接入并移除终端记录':'核对移除终端记录',`<p class="notice">${esc(effect)}</p><p>共 ${r.count} 个终端记录</p>`+frozen.items.map(s=>`<article class="job">${target(s)}<p>当前状态：${tag(s.state)}</p></article>`).join('')+`<p class="notice">${esc(frozen.notice)}</p><p>有效至 ${esc(frozen.expires)}</p>`,'<button data-close>取消</button><button id="session-removal-confirm" class="danger">确认移除，保留任务历史</button>','session-removal-review');
  sessionRemovalReview={ticket:frozen.ticket,items:frozen.items,signature:removalSnapshot(frozen.items,false),context:cg};
 }catch(e){if(current()){$('modal-error').textContent=e.message;$('modal-actions').innerHTML='<button data-close>关闭</button>';}}
 finally{if(cg===connectionGeneration){mutating=false;viewVersion='';render();}}
}
async function confirmSessionRemoval(){
 if(!removalReady()||modalKind!=='session-removal-review'||!sessionRemovalReview)return;
 if(sessionRemovalReview.signature!==removalSnapshot(sessionRemovalReview.items,true)||sessionRemovalReview.context!==connectionGeneration){invalidateSessionRemoval();return;}
 const frozen=sessionRemovalReview,cg=connectionGeneration,mg=outputGeneration,current=()=>cg===connectionGeneration&&mg===outputGeneration;sessionRemovalReview=null;$('feedback').textContent='';mutating=true;
 $('session-removal-confirm').disabled=true;$('session-removal-confirm').textContent='本次确认已结束';viewVersion='';render();
 try{const r=await rpc('sessionRemovalConfirm',{ticket:frozen.ticket});if(!current())return;if(r?.recorded!==true||!Array.isArray(r.ids)||r.ids.length!==frozen.items.length||new Set(r.ids).size!==r.ids.length||r.ids.some(id=>!frozen.items.some(s=>s.id===id)))throw Error('移除结果记录不一致。');$('modal').close();modalKind='';outputGeneration++;$('feedback').textContent='终端记录已移除，列表正在刷新。';}
 catch(e){if(current())$('modal-error').textContent='结果未确认。'+e.message+' 本次确认已消耗；请刷新列表并查询原任务，不要自动重试。';}
 finally{if(cg===connectionGeneration){mutating=false;await refresh();}}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||mutating)return;if(b.id==='session-cleanup')prepareSessionRemoval('cleanup');if(b.dataset.removeSession)prepareSessionRemoval('remove',b.dataset.removeSession);if(b.id==='session-removal-confirm')confirmSessionRemoval();});
render();refresh();setInterval(()=>{refresh();if(!removalFresh()){viewVersion='';render();}if(modalKind==='output'&&!outputDrained)loadOutput();},2000);
</script></body></html>
